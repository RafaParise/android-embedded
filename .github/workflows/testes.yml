name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o pytest
        run: python -m pip install --quiet pytest
      - name: Rodar a bateria (ADB falso; nenhum celular é tocado)
        run: python -m pytest scripts/tests -q -p no:cacheprovider
